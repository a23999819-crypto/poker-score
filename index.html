<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>德州扑克积分</title>
<meta name="theme-color" content="#0f141c"/>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="扑克积分"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<style>
:root{
  --bg:#0f141c; --card:#182130; --card2:#1f2a3c; --line:#2b394e;
  --gold:#e8b64c; --green:#33c46d; --red:#ef5f5f; --blue:#4aa3f0; --purple:#a97bf0;
  --txt:#e8edf5; --sub:#8fa0b8; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(6px + var(--safe-t)) 8px calc(58px + var(--safe-b))}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 1px 5px;line-height:1.2}
.topbar .t{font-size:15px;font-weight:800;display:flex;align-items:center;gap:5px}
.topbar .t .chip{background:var(--gold);color:#20170a;border-radius:6px;padding:0 6px;font-size:13px}
.topbar .s{font-size:10px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px 7px;margin-bottom:6px}
.card h2{font-size:12px;margin:0 0 5px;color:var(--gold);letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;gap:5px}
.card h2 .mini{font-size:10px;color:var(--sub);font-weight:400;display:flex;gap:2px;align-items:center}
label.fld{display:block;font-size:10px;color:var(--sub);margin-bottom:1px}
input[type=number],input[type=text],select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:5px 6px;font-size:15px;outline:none;user-select:text;-webkit-user-select:text}
input:focus,select:focus{border-color:var(--gold)}
button{cursor:pointer;border:none;border-radius:7px;font-size:12px;padding:6px 8px;background:var(--card2);color:var(--txt);border:1px solid var(--line);transition:.1s;user-select:none;line-height:1.2}
button:active{transform:scale(.95)}
button:hover{filter:brightness(1.12)}
button.primary{background:linear-gradient(180deg,#f0c65e,#d99f2e);color:#241a06;font-weight:800;border:none}
button.green{background:linear-gradient(180deg,#3fd07d,#229b55);color:#06240f;font-weight:700;border:none}
button.blue{background:linear-gradient(180deg,#5fb0f5,#2b7fd0);color:#04203a;font-weight:700;border:none}
button.purple{background:linear-gradient(180deg,#b98ff5,#7d4fd0);color:#16062e;font-weight:700;border:none}
button.ghost{background:transparent;padding:1px 4px;font-size:10px;border:none;color:var(--sub)}
button.ghost:hover{color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
.players{display:grid;gap:5px;grid-template-columns:repeat(2,1fr)}
.p{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:5px 6px}
.p .nm{font-size:11px;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:3px;line-height:1.2}
.p .nm b{color:#dbe4f0;font-size:11px}
.p .sc{font-size:22px;font-weight:800;margin:1px 0 4px;font-variant-numeric:tabular-nums;line-height:1.05}
.p.winner{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.p .acts{display:flex;gap:3px}
.p .acts button{flex:1;padding:5px 1px;font-size:10px;border-radius:6px}
.tag{font-size:9px;padding:0 3px;border-radius:4px;white-space:nowrap}
.tag.warn{background:rgba(239,95,95,.18);color:var(--red)}
.tag.over{background:rgba(232,182,76,.18);color:var(--gold)}
.lossgrid{display:flex;gap:5px;margin-top:5px}
.lossgrid .col{flex:1}
.lossgrid .col label{display:block;font-size:10px;color:#dbe4f0;margin-bottom:1px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lossgrid .col input{width:100%;text-align:center;font-size:15px;font-weight:800;padding:4px 2px}
.preview{font-size:11px;color:var(--sub);margin:5px 0;background:var(--card2);border:1px dashed var(--line);border-radius:7px;padding:5px 7px;line-height:1.5}
.preview b{color:var(--green);font-size:15px}
.bar{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.bar .q{width:52px;text-align:center;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:3px 3px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--sub);font-weight:600;font-size:10px;position:sticky;top:0;background:var(--card)}
td.det{text-align:left;white-space:normal;min-width:110px;color:#c6d2e4}
.pos{color:var(--green);font-weight:700}
.neg{color:var(--red);font-weight:700}
.zero{color:#5b6b83}
.scn{color:#9fb0c9;font-size:10px}
.rowtype{font-size:9px;padding:0 4px;border-radius:4px}
.t-game{background:rgba(232,182,76,.15);color:var(--gold)}
.t-water{background:rgba(74,163,240,.15);color:var(--blue)}
.t-reduce{background:rgba(169,123,240,.15);color:var(--purple)}
.tblwrap{overflow-y:auto;overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:124px;scrollbar-width:thin}
.tblwrap.open{max-height:46vh}
.tblwrap::-webkit-scrollbar{width:3px;height:3px}
.tblwrap::-webkit-scrollbar-thumb{background:#3a4a63;border-radius:2px}
.del{background:transparent;border:none;color:#5b6b83;font-size:12px;padding:0 3px}
.del:hover{color:var(--red)}
.empty{color:var(--sub);font-size:11px;text-align:center;padding:8px 0}
.hint{font-size:10px;color:var(--sub);line-height:1.6}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(15,20,28,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:5px 8px calc(5px + var(--safe-b));z-index:40}
.dock .inner{max-width:560px;margin:0 auto;display:flex;gap:6px}
.dock button{flex:1;padding:9px;font-size:12px;font-weight:700}
.settings{display:none}
.settings.on{display:block}
.sgrid{display:grid;gap:6px;grid-template-columns:repeat(2,1fr)}
.sgrid .full{grid-column:1/-1}
.mask{position:fixed;inset:0;background:rgba(4,8,14,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.mask.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;width:100%;max-width:310px}
.modal h3{margin:0 0 10px;font-size:15px}
.pv{font-size:12px;color:var(--sub);margin:10px 0 12px;background:var(--card2);border:1px dashed var(--line);border-radius:9px;padding:8px 9px;line-height:1.6}
.pv b{font-size:18px}
.pv b.g{color:var(--green)}.pv b.p{color:var(--purple)}.pv b.r{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(66px + var(--safe-b));transform:translateX(-50%);background:#26334a;border:1px solid var(--line);padding:7px 13px;border-radius:9px;font-size:12px;display:none;z-index:60}
@media(min-width:520px){.players{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="t"><span class="chip">♠</span>德州扑克积分</div>
    <div class="s" id="topInfo"></div>
  </div>

  <div class="card">
    <h2>实时分数 <span class="mini" id="roundInfo"></span></h2>
    <div class="players" id="players"></div>
  </div>

  <div class="card">
    <h2>记一笔 <span class="mini" id="whoWin"></span></h2>
    <div class="lossgrid" id="lossBox"></div>
    <div class="preview" id="settlePreview">先在上面分数卡点「☆ 赢」选本局赢家</div>
    <div class="bar">
      <button class="primary" id="btnSettle" style="flex:1;padding:11px;font-size:14px">结算这一把</button>
      <button class="blue" id="btnQuick">快捷填充</button>
      <input type="number" id="qVal" class="q" min="0" inputmode="numeric" title="每人填多少分">
    </div>
  </div>

  <div class="card">
    <h2>记录
      <span class="mini">
        <button class="ghost" id="btnUndo">↩ 撤销</button>
        <button class="ghost" id="btnLatest">⤒ 最新</button>
        <button class="ghost" id="btnFold">展开全部</button>
      </span>
    </h2>
    <div class="tblwrap" id="tblwrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    <div class="empty" id="empty">还没有记录，快记第一笔吧</div>
  </div>

  <div class="card settings" id="settingsCard">
    <h2>规则设置 <span class="mini">改完即时生效</span></h2>
    <div class="sgrid">
      <div><label class="fld">玩家人数</label>
        <select id="s_count"><option value="2">2 人</option><option value="3">3 人</option><option value="4">4 人</option></select></div>
      <div><label class="fld">初始积分</label><input type="number" id="s_initial" min="0" inputmode="numeric"></div>
      <div><label class="fld">一杯水加分</label><input type="number" id="s_water" min="0" inputmode="numeric"></div>
      <div><label class="fld">消分阈值</label><input type="number" id="s_threshold" min="0" inputmode="numeric"></div>
      <div><label class="fld">每次消分</label><input type="number" id="s_reduce" min="0" inputmode="numeric"></div>
      <div><label class="fld">快捷填充默认</label><input type="number" id="s_quick" min="0" inputmode="numeric"></div>
      <div class="full" id="nameBox" style="display:grid;gap:6px;grid-template-columns:repeat(2,1fr)"></div>
    </div>
    <div class="bar" style="margin-top:7px">
      <button class="ghost" id="btnCsv">⬇ 导出 CSV</button>
      <button class="ghost" id="btnReset" style="color:#ef9a9a">🗑 重置积分</button>
      <button class="ghost" id="btnHelp">📲 已安装为 App</button>
    </div>
  </div>
</div>

<div class="dock">
  <div class="inner"><button id="btnSettings">⚙ 规则设置</button></div>
</div>

<div class="mask" id="maskW">
  <div class="modal">
    <h3>喝水加分 · <span id="wmName"></span></h3>
    <div style="display:grid;gap:8px;grid-template-columns:1fr 1fr">
      <div><label class="fld">杯数</label><input type="number" id="wmCups" min="1" value="1" inputmode="numeric"></div>
      <div><label class="fld">每杯分值</label><input type="number" id="wmValue" min="0" inputmode="numeric"></div>
    </div>
    <div class="pv">合计加分：<b class="g" id="wmPrev">+50</b></div>
    <div class="bar">
      <button class="green" id="wmOk" style="flex:1">确认喝水</button>
      <button class="ghost" id="wmCancel">取消</button>
    </div>
  </div>
</div>

<div class="mask" id="maskR">
  <div class="modal">
    <h3>消分确认 · <span id="rmName"></span></h3>
    <div><label class="fld">消分数值</label><input type="number" id="rmValue" min="0" inputmode="numeric"></div>
    <div class="pv" id="rmPrev"></div>
    <div class="bar">
      <button class="purple" id="rmOk" style="flex:1">确认消分</button>
      <button class="ghost" id="rmCancel">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='txpoker_score_v2';
const DEF={count:3,initial:100,water:50,threshold:300,reduce:150,quick:10,names:['玩家1','玩家2','玩家3','玩家4']};
let S=loadState();
let lossDraft={},fold=true;
function loadState(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.settings&&r.rows)return r;}catch(e){}
  return {settings:JSON.parse(JSON.stringify(DEF)),rows:[],lastWater:{value:50,cups:1},lastReduce:150,winner:null};
}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function players(){const n=+S.settings.count,a=[];for(let i=0;i<n;i++)a.push({id:'p'+i,name:S.settings.names[i]||('玩家'+(i+1))});return a;}
function nameOf(id){const i=+id.slice(1);return S.settings.names[i]||('玩家'+(i+1));}
function clampInt(v,def,min,max){v=parseInt(v,10);if(isNaN(v))v=def;if(min!=null&&v<min)v=min;if(max!=null&&v>max)v=max;return v;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtTime(iso){const d=new Date(iso),p=n=>String(n).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes());}
const $=id=>document.getElementById(id);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}

function recompute(){
  const sc={};players().forEach(p=>sc[p.id]=+S.settings.initial);
  S.rows.forEach(r=>{Object.keys(r.deltas).forEach(k=>{if(k in sc)sc[k]+=r.deltas[k];});r.scores=Object.assign({},sc);});
  return sc;
}
function pushRow(type,actor,deltas,note){
  S.rows.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),ts:new Date().toISOString(),type,actor,deltas,note,scores:{}});
  recompute();save();
}
function readLosses(){
  const d={};let total=0;
  players().forEach(p=>{
    if(p.id===S.winner)return;
    const el=$('loss_'+p.id);
    const v=el?clampInt(el.value,0,0,99999):(lossDraft[p.id]||0);
    lossDraft[p.id]=v;d[p.id]=-v;total+=v;
  });
  return {deltas:d,total};
}

function fillSettings(){
  $('s_count').value=S.settings.count;
  $('s_initial').value=S.settings.initial;
  $('s_water').value=S.settings.water;
  $('s_threshold').value=S.settings.threshold;
  $('s_reduce').value=S.settings.reduce;
  $('s_quick').value=S.settings.quick;
  $('qVal').value=S.settings.quick;
  const box=$('nameBox');box.innerHTML='';
  for(let i=0;i<4;i++){
    const off=i>=+S.settings.count;
    const d=document.createElement('div');
    d.innerHTML='<label class="fld">玩家'+(i+1)+'名称</label><input type="text" id="nm'+i+'" value="'+esc(S.settings.names[i]||'')+'"'+(off?' disabled':'')+(off?' style="opacity:.4"':'')+'>';
    box.appendChild(d);
  }
}
function renderScores(){
  const sc=recompute(),th=+S.settings.threshold,box=$('players');box.innerHTML='';
  players().forEach(p=>{
    const v=sc[p.id];
    const badge=v>th?'<span class="tag over">超'+th+'</span>':(v<=0?'<span class="tag warn">缺水</span>':'');
    const color=v<0?'var(--red)':(v>th?'var(--gold)':'var(--txt)');
    const div=document.createElement('div');
    div.className='p'+(S.winner===p.id?' winner':'');
    div.innerHTML='<div class="nm"><b>'+esc(p.name)+'</b>'+(S.winner===p.id?'<span class="tag over">赢家</span>':badge)+'</div>'+
      '<div class="sc" style="color:'+color+'">'+v+'</div>'+
      '<div class="acts">'+
        '<button data-act="win" data-id="'+p.id+'">'+(S.winner===p.id?'★ 赢':'☆ 赢')+'</button>'+
        '<button class="blue" data-act="water" data-id="'+p.id+'">水+'+S.settings.water+'</button>'+
        '<button class="purple" data-act="reduce" data-id="'+p.id+'">消-'+S.settings.reduce+'</button>'+
      '</div>';
    box.appendChild(div);
  });
  $('roundInfo').textContent='共 '+S.rows.length+' 笔';
  $('topInfo').textContent=S.rows.length?('更新 '+fmtTime(S.rows[S.rows.length-1].ts)):'开局 '+S.settings.initial+' 分';
}
function renderLossBox(){
  const box=$('lossBox');box.innerHTML='';
  if(!S.winner){
    box.innerHTML='<div class="hint" style="margin:3px 0">在上面分数卡点「☆ 赢」选本局赢家，这里会出现输家的分数输入框。</div>';
    $('whoWin').textContent='';
    return;
  }
  $('whoWin').textContent='赢家：'+nameOf(S.winner);
  players().forEach(p=>{
    if(p.id===S.winner)return;
    const v=lossDraft[p.id]||0;
    const d=document.createElement('div');
    d.className='col';
    d.innerHTML='<label>'+esc(p.name)+' 输</label>'+
      '<input type="number" id="loss_'+p.id+'" min="0" inputmode="numeric" value="'+v+'">';
    box.appendChild(d);
  });
  box.querySelectorAll('input').forEach(el=>el.addEventListener('input',renderPreview));
}
function renderPreview(){
  const box=$('settlePreview');
  if(!S.winner){box.textContent='先在上面分数卡点「☆ 赢」选本局赢家';return;}
  const {deltas,total}=readLosses();
  const parts=players().filter(p=>p.id!==S.winner).map(p=>nameOf(p.id)+' -'+(-deltas[p.id]));
  box.innerHTML='本局：<b>'+nameOf(S.winner)+' +'+total+'</b>　'+(parts.length?parts.join('　'):'（无输家）');
}
function renderHistory(){
  const ps=players(),th=$('tbl').querySelector('thead'),tb=$('tbl').querySelector('tbody');
  let head='<tr><th>#</th><th>时间</th><th style="text-align:left">明细</th>';
  ps.forEach(p=>head+='<th>'+esc(p.name)+'</th>');
  head+='<th></th></tr>';th.innerHTML=head;
  tb.innerHTML='';
  $('empty').style.display=S.rows.length?'none':'block';
  $('tblwrap').style.display=S.rows.length?'':'none';
  S.rows.forEach((r,i)=>{
    const t={game:'<span class="rowtype t-game">局</span>',water:'<span class="rowtype t-water">水</span>',reduce:'<span class="rowtype t-reduce">消</span>'}[r.type];
    let tr='<tr><td>'+(i+1)+'</td><td>'+fmtTime(r.ts)+'</td><td class="det">'+esc(r.note)+'</td>';
    ps.forEach(p=>{
      const d=r.deltas[p.id]||0,s=r.scores[p.id];
      const ds=d>0?'<span class="pos">+'+d+'</span>':(d<0?'<span class="neg">'+d+'</span>':'<span class="zero">—</span>');
      tr+='<td>'+ds+' <span class="scn">'+s+'</span></td>';
    });
    tr+='<td><button class="del" data-del="'+r.id+'" title="删除">✕</button></td></tr>';
    tb.insertAdjacentHTML('beforeend',tr);
  });
  $('btnFold').textContent=fold?('展开全部 '+S.rows.length):'收起';
  $('tblwrap').classList.toggle('open',!fold);
  if(fold)requestAnimationFrame(()=>{const w=$('tblwrap');w.scrollTop=w.scrollHeight;});
}
function renderAll(){renderScores();renderLossBox();renderPreview();renderHistory();}

function settle(){
  if(!S.winner){toast('请先选择本局赢家');return;}
  const {deltas,total}=readLosses();
  const losers=players().filter(p=>p.id!==S.winner);
  const parts=losers.map(p=>nameOf(p.id)+' -'+(-deltas[p.id]));
  pushRow('game',S.winner,deltas,nameOf(S.winner)+' 赢 +'+total+'；'+(parts.join('，')||'无输家'));
  losers.forEach(p=>lossDraft[p.id]=0);
  let sc=recompute(),guard=0;
  while(sc[S.winner]>+S.settings.threshold && guard++<20){
    pushRow('reduce',S.winner,{[S.winner]:-+S.settings.reduce},nameOf(S.winner)+' '+sc[S.winner]+'分超'+S.settings.threshold+'，自动消'+S.settings.reduce);
    sc=recompute();
  }
  S.winner=null;
  renderAll();
  toast('已结算');
}
function doWater(pid,cups,value){
  const total=cups*value;
  S.lastWater={cups,value};
  pushRow('water',pid,{[pid]:total},nameOf(pid)+' 喝水 '+cups+'杯×'+value+'=+'+total);
  renderAll();
}
function doReduce(pid,value){
  const sc=recompute(),v=sc[pid];
  S.lastReduce=value;
  pushRow('reduce',pid,{[pid]:-value},nameOf(pid)+' 手动消分 -'+value+'（'+v+'→'+(v-value)+'）');
  renderAll();
  toast(nameOf(pid)+' 已消 '+value+' 分');
}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1500);}

$('players').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.dataset.id;
  if(b.dataset.act==='win'){S.winner=(S.winner===id?null:id);save();renderAll();}
  else if(b.dataset.act==='water'){openWater(id);}
  else if(b.dataset.act==='reduce'){openReduce(id);}
});
$('btnSettle').addEventListener('click',settle);
$('btnQuick').addEventListener('click',()=>{
  if(!S.winner){toast('请先选择本局赢家');return;}
  const v=clampInt($('qVal').value,S.settings.quick,0);
  S.settings.quick=v;save();
  players().forEach(p=>{if(p.id!==S.winner){lossDraft[p.id]=v;const el=$('loss_'+p.id);if(el)el.value=v;}});
  renderPreview();fillSettings();
  toast('已填充每人 '+v+' 分');
});
$('tbl').addEventListener('click',e=>{
  const b=e.target.closest('button[data-del]');if(!b)return;
  if(!confirm('确定删除这一笔？分数会按剩余记录重新计算。'))return;
  S.rows=S.rows.filter(r=>r.id!==b.dataset.del);
  recompute();save();renderAll();
});
$('btnUndo').addEventListener('click',()=>{
  if(!S.rows.length){toast('没有可撤销的记录');return;}
  S.rows.pop();recompute();save();renderAll();toast('已撤销上一笔');
});
$('btnLatest').addEventListener('click',()=>{const w=$('tblwrap');w.scrollTop=w.scrollHeight;toast('已跳到最新一笔');});
$('btnFold').addEventListener('click',()=>{fold=!fold;renderHistory();});
$('btnReset').addEventListener('click',()=>{
  if(!confirm('确定清空所有流水、分数回到初始值？（规则设置保留）'))return;
  S.rows=[];S.winner=null;lossDraft={};recompute();save();renderAll();toast('已重置');
});
$('btnCsv').addEventListener('click',exportCsv);
$('btnHelp').addEventListener('click',()=>{toast('已作为独立 App 运行，可断网使用');});
$('btnSettings').addEventListener('click',()=>{
  const c=$('settingsCard');
  c.classList.toggle('on');
  if(c.classList.contains('on')){fillSettings();c.scrollIntoView({behavior:'smooth',block:'end'});$('btnSettings').textContent='✕ 收起设置';}
  else{$('btnSettings').textContent='⚙ 规则设置';window.scrollTo({top:0,behavior:'smooth'});}
});
['initial','water','threshold','reduce','quick'].forEach(k=>{
  $('s_'+k).addEventListener('input',()=>{
    S.settings[k]=clampInt($('s_'+k).value,DEF[k],0);
    if(k==='quick')$('qVal').value=S.settings.quick;
    save();renderScores();renderHistory();
  });
});
$('s_count').addEventListener('change',()=>{
  const n=clampInt($('s_count').value,3,2,4);
  S.settings.count=n;
  S.rows.forEach(r=>{Object.keys(r.deltas).forEach(k=>{if(+k.slice(1)>=n)delete r.deltas[k];});});
  if(S.winner&&+S.winner.slice(1)>=n)S.winner=null;
  Object.keys(lossDraft).forEach(k=>{if(+k.slice(1)>=n)delete lossDraft[k];});
  save();fillSettings();renderAll();
});
$('nameBox').addEventListener('input',e=>{
  if(e.target.id&&e.target.id.indexOf('nm')===0){
    const i=+e.target.id.slice(2);
    S.settings.names[i]=e.target.value.trim()||('玩家'+(i+1));
    save();renderScores();renderLossBox();renderPreview();renderHistory();
  }
});

let waterPid=null;
function openWater(pid){
  waterPid=pid;
  $('wmName').textContent=nameOf(pid);
  $('wmCups').value=S.lastWater.cups||1;
  $('wmValue').value=S.lastWater.value||S.settings.water;
  updateWmPrev();$('maskW').classList.add('on');
}
function updateWmPrev(){
  const c=clampInt($('wmCups').value,1,1,99),v=clampInt($('wmValue').value,50,0);
  $('wmPrev').textContent='+'+(c*v);
}
$('wmCups').addEventListener('input',updateWmPrev);
$('wmValue').addEventListener('input',updateWmPrev);
$('wmOk').addEventListener('click',()=>{
  const c=clampInt($('wmCups').value,1,1,99),v=clampInt($('wmValue').value,50,0);
  doWater(waterPid,c,v);$('maskW').classList.remove('on');toast('已记喝水 +'+(c*v));
});
$('wmCancel').addEventListener('click',()=>$('maskW').classList.remove('on'));
$('maskW').addEventListener('click',e=>{if(e.target===$('maskW'))$('maskW').classList.remove('on');});

let reducePid=null;
function openReduce(pid){
  reducePid=pid;
  $('rmName').textContent=nameOf(pid);
  $('rmValue').value=S.lastReduce||S.settings.reduce;
  updateRmPrev();$('maskR').classList.add('on');
}
function updateRmPrev(){
  const v=clampInt($('rmValue').value,S.settings.reduce,0);
  const cur=recompute()[reducePid];
  $('rmPrev').innerHTML='当前 <b>'+cur+'</b> → 消 <b class="r">'+v+'</b> → 剩余 <b class="p">'+(cur-v)+'</b>';
}
$('rmValue').addEventListener('input',updateRmPrev);
$('rmOk').addEventListener('click',()=>{
  const v=clampInt($('rmValue').value,S.settings.reduce,0);
  doReduce(reducePid,v);$('maskR').classList.remove('on');
});
$('rmCancel').addEventListener('click',()=>$('maskR').classList.remove('on'));
$('maskR').addEventListener('click',e=>{if(e.target===$('maskR'))$('maskR').classList.remove('on');});

function exportCsv(){
  const ps=players();
  const head=['序号','时间','类型','明细'].concat(...ps.map(p=>[p.name+'变动',p.name+'结算后']));
  const lines=[head.join(',')];
  S.rows.forEach((r,i)=>{
    const cells=[i+1,fmtTime(r.ts),{game:'对局',water:'喝水',reduce:'消分'}[r.type],'"'+r.note.replace(/"/g,'""')+'"'];
    ps.forEach(p=>{const d=r.deltas[p.id]||0;cells.push((d>0?'+':'')+d);cells.push(r.scores[p.id]);});
    lines.push(cells.join(','));
  });
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='poker_scores.csv';a.click();
}

fillSettings();recompute();renderAll();
</script>
</body>
</html>
